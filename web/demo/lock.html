<!doctype html>
<html lang="en" data-ui="dock" data-palette="studio">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Karots Demo Room</title>
    <script type="module" src="./lock.ts"></script>
  </head>
  <body>
    <main class="lock">
      <form class="lock-card" autocomplete="off">
        <h1>Karots Demo Room</h1>
        <p class="muted">Enter this hour's code for install <b id="install">…</b></p>
        <input id="code" name="ks-demo-code" inputmode="numeric" maxlength="6" aria-label="Code" autofocus />
        <p class="err" id="err" role="alert"></p>
        <button class="btn" type="submit">Unlock</button>
        <div class="ask" id="ask" hidden>
          <p><b>Want to try it?</b> Ask Karots for this hour's code.</p>
          <div class="ask-ways">
            <a class="btn quiet" id="ask-wa" target="_blank" rel="noopener">WhatsApp</a>
            <a class="btn quiet" id="ask-tel"></a>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
