<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16132B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Karots" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karots Suite</title>
    <script>try{var m=localStorage.getItem('ks-mode');if(m==='light'||m==='dark')document.documentElement.dataset.theme=m;var t=localStorage.getItem('ks-touch');if(t==='on'||t==='off')document.documentElement.dataset.touch=t;document.documentElement.dataset.palette=localStorage.getItem('ks-palette')||'studio'}catch(e){document.documentElement.dataset.palette='studio'}document.documentElement.dataset.ui='dock'</script>
    <!-- The active custom palette (empty for a built-in): a render-blocking stylesheet, so it paints with the first frame. -->
    <link id="ks-palette-css" rel="stylesheet" href="/api/v1/appearance/palette.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
